name: Export current Terpfolio source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest source
        shell: bash
        run: |
          latest_zip="$(ls -1 Terpfolio-source-v*.zip | sort -V | tail -n 1)"
          mkdir source-export
          cp "$latest_zip" source-export/
      - name: Download UK catalogue source pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib
          pages = {'ukflwr-flower':'https://ukflwr.com/medical-cannabis-uk.php?prod_cat=flower', 'ukflwr-brands':'https://ukflwr.com/medical-cannabis-brands.php', 'medibud':'https://medibud.app/', 'medbud':'https://medbud.wiki/strains/', 'medibud-js':'https://medibud.app/assets/index-rIupZGiN.js', 'directory':'https://thereasonableadjustment.co.uk/medical-cannabis/strains/', 'medibud-data':'https://medibud.app/api/strains', 'encycloseedia':'https://encycloseedia.co.uk/strains'}
          for name,url in pages.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=40).read()
                  pathlib.Path('source-export/'+name+'.html').write_bytes(data)
                  print(name,len(data))
              except Exception as e:
                  print(name,type(e).__name__,str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Terpfolio-current-source
          path: source-export/*
          if-no-files-found: error
