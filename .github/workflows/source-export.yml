name: Export current Terpfolio source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest source
        shell: bash
        run: |
          latest_zip="$(ls -1 Terpfolio-source-v*.zip | sort -V | tail -n 1)"
          mkdir source-export
          cp "$latest_zip" source-export/
      - uses: actions/upload-artifact@v4
        with:
          name: Terpfolio-current-source
          path: source-export/*.zip
          if-no-files-found: error
