name: Build Terpfolio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: terpfolio-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Unpack latest Terpfolio source
        shell: bash
        run: |
          latest_zip="$(ls -1 Terpfolio-source-v*.zip | sort -V | tail -n 1)"
          if [[ -z "$latest_zip" ]]; then
            echo "No versioned Terpfolio source ZIP was found." >&2
            exit 1
          fi
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q "$latest_zip" -d extracted-project
          echo "Building from $latest_zip"

      - name: Locate Android project
        shell: bash
        run: |
          if [[ -f "extracted-project/gradlew" && -f "extracted-project/settings.gradle.kts" ]]; then
            echo "TERPFOLIO_PROJECT_DIR=extracted-project" >> "$GITHUB_ENV"
          elif [[ -f "extracted-project/MedLeafJournal/gradlew" && -f "extracted-project/MedLeafJournal/settings.gradle.kts" ]]; then
            echo "TERPFOLIO_PROJECT_DIR=extracted-project/MedLeafJournal" >> "$GITHUB_ENV"
          else
            echo "Could not find the Terpfolio Gradle project." >&2
            exit 1
          fi

      - name: Apply reviewed UK catalogue expansion
        run: python3 catalogue-tools/apply_catalogue_overlay.py "$TERPFOLIO_PROJECT_DIR"

      - name: Apply review editor performance fix
        run: python3 catalogue-tools/apply_performance_fix.py "$TERPFOLIO_PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        shell: bash
        run: |
          cd "$TERPFOLIO_PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify package identity and upgrade signing key
        run: python3 catalogue-tools/verify_apk.py "$TERPFOLIO_PROJECT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: Terpfolio-debug
          path: ${{ env.TERPFOLIO_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terpfolio-test-results
          path: ${{ env.TERPFOLIO_PROJECT_DIR }}/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Package expanded source
        shell: bash
        run: |
          cd "$TERPFOLIO_PROJECT_DIR"
          zip -q -r "$GITHUB_WORKSPACE/Terpfolio-source-v0.55.2.zip" . -x '*/build/*' '.gradle/*'

      - uses: actions/upload-artifact@v4
        with:
          name: Terpfolio-v0.55.2-source
          path: Terpfolio-source-v0.55.2.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Terpfolio-upgrade-verification
          path: ${{ env.TERPFOLIO_PROJECT_DIR }}/apk-upgrade-verification.json
